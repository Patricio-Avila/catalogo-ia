name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Pruebas del núcleo y del cliente
        run: pnpm test

      # T2: cuando existan migraciones y pruebas pgTAP se agregan aquí
      # - uses: supabase/setup-cli@v1
      # - run: pnpm supabase start
      # - run: pnpm supabase test db
