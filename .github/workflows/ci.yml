name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nucleo:
    name: Núcleo y API (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Verificar tipos
        run: pnpm typecheck
      - name: Pruebas del núcleo y del cliente
        run: pnpm test
      # Falla si alguna maliciosa o de contexto de riesgo no se bloquea, o si alguna
      # frase del banco tiene respuesta fija en el adaptador evaluado.
      - name: Evaluación en memoria (guardas)
        run: pnpm eval
      # El núcleo empaquetado no se versiona: se genera y se verifica contra index.ts y deno.json.
      - name: Paquete de la Edge Function
        run: |
          pnpm build:edge
          pnpm --filter @catalogo-ia/core exec tsx scripts/verificar_edge.ts

  base_de_datos:
    name: Base de datos (migraciones, seed y pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      # Solo la base: sin Studio, buzón, almacenamiento ni funciones. Aplica migraciones y seed.
      - name: Levantar Supabase local
        run: pnpm supabase start -x studio,imgproxy,inbucket,mailpit,edge-runtime,logflare,vector,realtime,storage-api,supavisor,pg_prove
      - name: Resumen de la carga
        run: |
          pnpm supabase db query --help > /dev/null 2>&1 || true
          docker exec supabase_db_catalogo-ia psql -U postgres -d postgres -c "select dominio, categoria, count(*) from catalogo.producto group by 1,2 order by 1,2" -c "select dominio, version_diccionario from catalogo.vertical"
      - name: Pruebas pgTAP
        run: pnpm supabase test db
      # Contraseña del usuario de la API generada en cada corrida (la de seed.sql es
      # solo para desarrollo local). Se enmascara en el log y no sale del runner.
      - name: Conexiones del agente y del administrador
        run: |
          CLAVE=$(openssl rand -hex 24)
          echo "::add-mask::$CLAVE"
          docker exec supabase_db_catalogo-ia psql -q -U postgres -d postgres -c "alter role agente_api with password '$CLAVE'"
          URL_ADMIN=$(pnpm -s supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')
          test -n "$URL_ADMIN"
          echo "::add-mask::$URL_ADMIN"
          echo "URL_BASE_ADMIN=$URL_ADMIN" >> "$GITHUB_ENV"
          echo "URL_BASE_AGENTE=postgresql://agente_api:$CLAVE@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"
      # Mismo banco que el job del núcleo, ahora con el usuario del agente contra PostgreSQL.
      - name: Evaluación contra PostgreSQL
        run: pnpm eval --acceso=postgres
      # p50 y p95 de las funciones de 0007 frente a los cuerpos de 0005 (RNF-05).
      - name: Mediciones de las funciones de búsqueda
        run: pnpm medir
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-base-de-datos
          path: |
            eval/resultados/*-postgres.json
            docs/mediciones/resultados/
          if-no-files-found: warn
      - name: Apagar
        if: always()
        run: pnpm supabase stop --no-backup
